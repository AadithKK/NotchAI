<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="NotchAI: an AI assistant that lives in your MacBook notch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="0.55" stop-color="#1a1440"/><stop offset="1" stop-color="#3a1f5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.7">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.35"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect width="1200" height="30" fill="#ffffff" opacity="0.08"/>
  <!-- island: flat-top shelf hanging from the notch -->
  <path d="M520 0 H680 V30 H800 V150 Q800 190 760 190 H440 Q400 190 400 150 V30 H520 Z" fill="#000"/>
  <g font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif">
    <rect x="428" y="58" width="100" height="100" rx="14" fill="#111"/>
    <rect x="538" y="58" width="100" height="100" rx="14" fill="#111"/>
    <rect x="648" y="58" width="124" height="100" rx="14" fill="#0d1a2e" stroke="#2f6fd0"/>
    <text x="478" y="116" fill="#fff" font-size="15" text-anchor="middle">Chat</text>
    <text x="588" y="116" fill="#fff" font-size="15" text-anchor="middle">Browser</text>
    <text x="710" y="116" fill="#5ac8fa" font-size="15" text-anchor="middle">Capture</text>
    <text x="600" y="262" fill="#fff" font-size="72" font-weight="700" text-anchor="middle" letter-spacing="-2">NotchAI</text>
    <text x="600" y="312" fill="url(#accent)" font-size="26" font-weight="500" text-anchor="middle">An AI assistant that lives in your MacBook notch</text>
    <text x="600" y="356" fill="#ffffff" opacity="0.6" font-size="18" text-anchor="middle">Hover to open  ·  Capture &amp; Answer  ·  Chat with documents  ·  Bring your own key</text>
  </g>
</svg>
